name: Atualizar INMET nacional e estatísticas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/atualizar-inmet-nacional.yml']
  schedule:
    # 07:25 em Mato Grosso (UTC-4); GitHub pode atrasar execuções agendadas.
    - cron: '25 11 * * *'
  workflow_dispatch:
    inputs:
      ano_anterior:
        description: "Consultar também o ano anterior (sem reprocessar SHA idêntico)"
        type: boolean
        required: false
        default: false
      forcar_reprocessamento:
        description: "Reprocessar SHA idêntico após mudança de algoritmo ou auditoria"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: climogramas-data-sync
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sincronizador sem rede
        run: |
          python -m unittest discover -s tests -p 'test_sync_inmet.py'
          python -m unittest discover -s tests -p 'test_plan_inmet_years.py'
      - name: Consultar ano atual e um ano nacional pendente (2019 em diante)
        id: sync
        continue-on-error: true
        env:
          INCLUDE_PREVIOUS: ${{ inputs.ano_anterior || 'false' }}
          FORCE: ${{ inputs.forcar_reprocessamento || 'false' }}
        run: |
          PLAN_FLAGS=""
          if [ "$(date -u +%d)" = "01" ] || [ "$INCLUDE_PREVIOUS" = "true" ]; then
            PLAN_FLAGS="--include-previous"
          fi
          YEARS=$(python tools/plan_inmet_years.py $PLAN_FLAGS)
          echo "Anos nacionais desta execução: $YEARS"
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="--force"; fi
          python tools/sync_inmet.py --years $YEARS $EXTRA
      - name: Conferir integridade dos JSONs
        run: |
          python - <<'PY'
          import datetime, json, pathlib
          stations=json.loads(pathlib.Path('assets/stations.json').read_text())
          assert len(stations)>100
          assert all('id' in s and 'years' in s for s in stations)
          current=datetime.datetime.now(datetime.timezone.utc).year
          for year in (current-1,current):
              for p in pathlib.Path('assets/data').glob(f'*/{year}.json'):
                  data=json.loads(p.read_text())
                  assert len(data['months'])==12 and 'quality' in data
          status=json.loads(pathlib.Path('assets/inmet-update-status.json').read_text())
          assert status.get('checked_utc') and isinstance(status.get('years'),list)
          print('Catálogo, séries e estado verificados:',len(stations))
          PY
      - name: Publicar dados válidos e estado de verificação, preservando o aplicativo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stations.json assets/years.json assets/inmet-update-status.json assets/data/
          if ! git diff --cached --quiet; then
            git commit -m "data(inmet): verificação diária nacional e atualização quando disponível"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Solicitar e verificar build do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/request_pages_build.sh
      - name: Sinalizar falha sem apagar o último resultado
        if: steps.sync.outcome != 'success'
        run: |
          echo 'Consulta/processamento falhou; dados anteriores preservados e estado publicado.'
          exit 1
